worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  # The base image runs as non-root: temp paths must be writable.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /dev/stdout  main;
  error_log   /dev/stderr warn;
  sendfile        on;
  keepalive_timeout  65;
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.0;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # HTML must be revalidated so a deploy is picked up immediately.
    location ~* \.html$ {
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite content-hashed assets (name-<8 chars>.ext) get a new URL when they
    # change, so they can be cached for a year. Must come before the rule below:
    # nginx uses the first matching regex location.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|json|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Unhashed files (public/favicon.png, public/epfl.svg, ...) keep the same URL
    # across deploys: revalidate them (cheap 304) so a replaced file is not stale.
    location ~* \.(js|css|json|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
