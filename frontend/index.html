<!doctype html>
<html>
    <head>
        <title><%= productName %></title>

        <meta charset="utf-8" />
        <meta name="description" content="<%= productDescription %>" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />
        <meta
            name="viewport"
            content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"

            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://enac-it-fonts.epfl.ch; font-src 'self' https://enac-it-fonts.epfl.ch; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="stylesheet" href="https://enac-it-fonts.epfl.ch/tokens/fonts.css" />
    </head>
