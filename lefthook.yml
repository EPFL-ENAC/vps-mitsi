#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    frontend-typecheck:
      root: frontend
      glob: "frontend/src/**/*.{ts,vue}"
      exclude: "frontend/third-party/**"
      run: npm run typecheck
    frontend-lint:
      root: frontend
      glob:
        - "frontend/{src,tests}/**/*.{ts,js,cjs,mjs,vue}"
        - "frontend/*.{ts,js,cjs,mjs}"
      exclude: "frontend/third-party/**"
      run: npm run lint
    frontend-format:
      root: frontend
      glob:
        - "frontend/{src,tests}/**/*.{js,ts,vue,scss,html,md,json}"
        - "frontend/*.{js,ts,cjs,mjs,json}"
      exclude: "frontend/third-party/**"
      run: npm run format:check

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p "@commitlint/cli" -p "@commitlint/config-conventional" -- commitlint --edit {1}
